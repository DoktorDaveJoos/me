[package]
name = "me-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true
description = "ME. desktop app for macOS and Linux, built with GPUI"

[[bin]]
name = "me"
path = "src/main.rs"

[features]
development-tools = ["me-core/development-tools"]

[dependencies]
base64 = "0.22"
curl = "0.4"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "webp"] }
regex = "1"
me-protocol = { path = "../../crates/me-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
me-diagnostics = { path = "../../crates/me-diagnostics" }
me-core.workspace = true
me-documents = { path = "../../crates/me-documents" }
me-agent = { path = "../../crates/me-agent" }
unicode-segmentation = "1.12"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { workspace = true, features = ["font-kit"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSRunningApplication", "NSButton", "NSEvent", "NSScreen", "NSWindow", "NSGraphics", "NSControl", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSGeometry", "NSObject", "NSString", "NSValue"] }
resvg = { version = "0.45", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { workspace = true, features = ["wayland", "x11"] }

[lints]
workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3"
