[package]
name = "me-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true
description = "ME. desktop app for macOS and Linux, built with GPUI"

[[bin]]
name = "me"
path = "src/main.rs"

[features]
development-tools = ["me-core/development-tools"]

[dependencies]
serde_json = "1"
url = "2"
me-diagnostics = { path = "../../crates/me-diagnostics" }
me-core.workspace = true
me-documents = { path = "../../crates/me-documents" }
me-agent = { path = "../../crates/me-agent" }
unicode-segmentation = "1.12"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { workspace = true, features = ["font-kit"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { workspace = true, features = ["wayland", "x11"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
