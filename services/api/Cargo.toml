[package]
name = "me-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[dependencies]
me-protocol = { path = "../../crates/me-protocol" }
axum = "=0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
sqlx-core = { version = "=0.8.6", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki", "json"] }
sqlx-postgres = { version = "=0.8.6", default-features = false, features = ["json"] }
argon2 = { version = "=0.5.3", features = ["zeroize"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
